<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Site temporariamente fora do ar</title>
  <style>
    :root {
      --bg: #f4f1ea;
      --card: #ffffff;
      --text: #1f2933;
      --muted: #5f6b7a;
      --accent: #e07a1f;
      --border: #e5e0d6;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14171c;
        --card: #1d2128;
        --text: #eef1f5;
        --muted: #9aa5b4;
        --accent: #f2994a;
        --border: #2b313a;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
    }
    .card {
      width: 100%;
      max-width: 520px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 48px 32px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.06);
    }
    .icon {
      width: 88px;
      height: 88px;
      margin: 0 auto 28px;
      color: var(--accent);
      animation: spin 6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .icon { animation: none; } }
    .badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      background: color-mix(in srgb, var(--accent) 12%, transparent);
      padding: 6px 12px;
      border-radius: 999px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: clamp(24px, 5vw, 32px);
      line-height: 1.25;
      margin-bottom: 14px;
    }
    p { color: var(--muted); font-size: 16px; }
    .divider {
      height: 1px;
      background: var(--border);
      margin: 32px 0 24px;
    }
    .small { font-size: 14px; }
    .btn {
      display: inline-block;
      margin-top: 24px;
      padding: 12px 24px;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }
    .btn:hover { filter: brightness(1.05); }
  </style>
</head>
<body>
  <main class="card">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
    </svg>

    <span class="badge">Em manutenção</span>
    <h1>Site temporariamente fora do ar</h1>
    <p>Estamos passando por uma instabilidade ou realizando melhorias. Pedimos desculpas pelo transtorno — em breve tudo estará funcionando normalmente.</p>

    <button class="btn" onclick="location.reload()">Tentar novamente</button>

    <div class="divider"></div>
    <p class="small">Obrigado pela paciência e compreensão.</p>
  </main>
</body>
</html>
